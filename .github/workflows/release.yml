name: Desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm run verify

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
          - name: linux
            runner: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Panzoid's pages can be behind a browser check on CI runners, so the
      # build restores the same pinned CM3 snapshot as Cloudflare Pages.
      ZOIDIUM_CM3_SNAPSHOT: r2://zoidium-cm3-cache/cm3-snapshot.zcs
      ZOIDIUM_R2_ACCOUNT_ID: 06a22facf684f7266a7e1722c236cd18
      ZOIDIUM_R2_ACCESS_KEY_ID: ${{ secrets.ZOIDIUM_R2_ACCESS_KEY_ID }}
      ZOIDIUM_R2_SECRET_ACCESS_KEY: ${{ secrets.ZOIDIUM_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore CM3 and build Electron installer
        run: pnpm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source metadata
        uses: actions/checkout@v7

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Create release for this main push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Zoidium main ${GITHUB_RUN_NUMBER}" \
            --notes "Automated desktop build for ${GITHUB_SHA}. CM3 resources were restored from the pinned snapshot during the build and are included in the installers." \
            --latest=false

          pids=()
          for asset in release-assets/*; do
            (
              uploaded=false
              for attempt in 1 2 3 4 5; do
                if timeout 180s gh release upload "$tag" "$asset" --clobber; then
                  uploaded=true
                  break
                fi
                echo "Upload failed for ${asset}; retrying in ${attempt}s (attempt ${attempt}/5)"
                sleep "$attempt"
              done
              if [[ "$uploaded" != true ]]; then
                echo "Failed to upload ${asset} after 5 attempts" >&2
                exit 1
              fi
            ) &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
